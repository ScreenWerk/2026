name: "🖥️ Signage Bug Report"
description: "Report a content / playback / scheduling / validity bug on a Screenwerk screen"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        A **quality** signage bug needs three things, not one:

        1. **Symptom** — what you saw.
        2. **Source-of-truth state** — what the Entu **CMS** shows.
        3. **🎯 Objective evidence** — what the **player actually received** (the published CDN JSON).

        The CMS and the published JSON can disagree — and that disagreement is usually where the bug lives. Fields marked 🎯 are the ones that tell us **data-side vs. player-side** in one shot. Half-filled reports get bounced back.

  - type: textarea
    id: summary
    attributes:
      label: "Summary — what went wrong"
      description: "One or two sentences. What did you expect, and what happened instead?"
      placeholder: "A banner set to start Monday started showing right away."
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: "Client / account"
      description: "Note: Bilietai's content lives under the `piletilevi` Entu account."
      options:
        - "Piletilevi — Estonia"
        - "Piletilevi — Latvia"
        - "Bilietai — Lithuania (piletilevi account)"
        - "Other / unknown"
    validations:
      required: true

  - type: input
    id: reporter
    attributes:
      label: "Reporter & date observed"
      placeholder: "Tomas Petryla (Bilietai), 2026-06-12"
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: "Expected vs. actual behavior"
      value: |
        **Expected:**

        **Actual:**
    validations:
      required: true

  - type: input
    id: cdn-json-url
    attributes:
      label: "🎯 Published CDN JSON URL"
      description: "The screen JSON the player actually fetched — NOT the CMS. Format: https://files.screenwerk.ee/screen/{screenId}.json"
      placeholder: "https://files.screenwerk.ee/screen/5577dea44ecca5c17a599427.json"
    validations:
      required: true

  - type: textarea
    id: cdn-json-evidence
    attributes:
      label: "🎯 Relevant values FROM the published JSON"
      description: "Paste the affected media's `validFrom` / `validTo` (and the file's `publishedAt`) as they appear in the published JSON. This is the decisive evidence — it tells us whether the player received bad data or mishandled good data."
      render: json
      placeholder: |
        {
          "publishedAt": "2026-06-12T...",
          "validFrom": "2026-06-15T07:00:00.000Z",
          "validTo": "2026-09-01T..."
        }
    validations:
      required: true

  - type: textarea
    id: cms-state
    attributes:
      label: "CMS source-of-truth state (Entu)"
      description: "What the Entu CMS shows for this entity — screenshot AND the typed-out values. Remember: the CMS is not what the player consumes."
    validations:
      required: true

  - type: textarea
    id: identifiers
    attributes:
      label: "Trace identifiers (eids)"
      description: "We walk the entity graph from these. Fill every one you can — screenshots usually omit them."
      value: |
        - playlist-media eid:
        - media eid:
        - playlist eid:
        - screen eid:
        - screen-group eid:
        - configuration eid:
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Reproduction steps + minimal failing fixture"
      description: "Deterministic steps. If you can, inline a minimal screen JSON that reproduces it — that becomes the failing test fixture (RED)."
      value: |
        1.
        2.
        3.

        **Minimal fixture (config JSON):**
        ```json
        ```
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "Observation context"
      description: "Rules in/out a device-side cause (clock, stale PWA shell)."
      value: |
        - Physical screen / location:
        - When it appeared (date + time + timezone):
        - Device clock correct? Timezone:
        - One screen only, or several?
    validations:
      required: true

  - type: textarea
    id: timeline
    attributes:
      label: "Edit timeline"
      description: "Upload time vs. when the start date / validity was set or edited. Edits can stack a SECOND property value in Entu — central to validity bugs."
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: "Scope"
      options:
        - "Single entity (one banner / media)"
        - "Multiple entities, one screen"
        - "Multiple screens, one client"
        - "Multiple clients / systemic"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "Critical — wrong / expired content live on customer screens"
        - "High — visible to end customers, workaround exists"
        - "Medium — incorrect but limited impact"
        - "Low — cosmetic / internal"
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: "Suspected layer (best guess — triage will confirm)"
      options:
        - "Data / Entu CMS (e.g. stacked property values)"
        - "Publish pipeline (Entu → JSON)"
        - "Player (filtering / scheduling / cache)"
        - "Device-side (clock, stale PWA shell)"
        - "Unknown"
    validations:
      required: false

  - type: dropdown
    id: tshirt
    attributes:
      label: "Complexity — t-shirt size (team standard)"
      description: "Every issue needs a size. Use 'Unknown until triaged' if genuinely unclear."
      options:
        - "XS"
        - "S"
        - "M"
        - "L"
        - "XL"
        - "Unknown until triaged"
    validations:
      required: true

  - type: textarea
    id: code-complexity
    attributes:
      label: "Code complexity (files / surfaces likely involved)"
      description: "Team standard — list suspected files/surfaces and rough cyclomatic complexity where known."
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      value: |
        - [ ] Failing-then-passing test reproduces the bug and proves the fix
        - [ ] No regression for currently-active media
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: gate
    attributes:
      label: "Workflow acknowledgment"
      options:
        - label: "This will follow the gate: issue → branch → TDD (RED first) → PR → review → merge."
          required: true

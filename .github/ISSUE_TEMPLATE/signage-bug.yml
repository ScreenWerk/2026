name: "🖥️ Signage Bug Report"
description: "Report a content / playback / scheduling / validity bug on a Screenwerk screen"
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report **what was observed** — facts and evidence only. Triage (severity, likely cause, sizing) happens after filing, not here. The CMS and the published JSON can disagree; capture both.

  - type: textarea
    id: summary
    attributes:
      label: "Summary — what went wrong"
      description: "One or two sentences. What did you expect, and what happened instead?"
      placeholder: "A banner set to start Monday started showing right away."
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: "Client / account"
      description: "Note: Bilietai's content lives under the `piletilevi` Entu account."
      options:
        - "Piletilevi — Estonia"
        - "Piletilevi — Latvia"
        - "Bilietai — Lithuania (piletilevi account)"
        - "Other / unknown"
    validations:
      required: true

  - type: input
    id: player-version
    attributes:
      label: "Player version"
      description: "The build the screen was running (e.g. `app/version.ts` value, or the version shown in the footer / console)."
      placeholder: "e.g. 2026.6.18"
    validations:
      required: true

  - type: input
    id: reporter
    attributes:
      label: "Reporter & date observed"
      placeholder: "Tomas Petryla (Bilietai), 2026-06-12"
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: "Expected vs. actual behavior"
      value: |
        **Expected:**

        **Actual:**
    validations:
      required: true

  - type: input
    id: cdn-json-url
    attributes:
      label: "Published CDN JSON URL"
      description: "The screen JSON the player actually fetched — NOT the CMS. Format: https://files.screenwerk.ee/screen/{screenId}.json"
      placeholder: "https://files.screenwerk.ee/screen/5577dea44ecca5c17a599427.json"
    validations:
      required: true

  - type: textarea
    id: cdn-json-evidence
    attributes:
      label: "Relevant values FROM the published JSON"
      description: "Paste the affected media's `validFrom` / `validTo` (and the file's `publishedAt`) exactly as they appear in the published JSON."
      render: json
    validations:
      required: true

  - type: textarea
    id: cms-state
    attributes:
      label: "Source-of-truth state (Entu CMS)"
      description: "What the Entu CMS shows for this entity — screenshot AND the typed-out values."
    validations:
      required: true

  - type: textarea
    id: identifiers
    attributes:
      label: "Trace identifiers (eids)"
      description: "We walk the entity graph from these. Fill every one you can."
      value: |
        - playlist-media eid:
        - media eid:
        - playlist eid:
        - screen eid:
        - screen-group eid:
        - configuration eid:
    validations:
      required: true
